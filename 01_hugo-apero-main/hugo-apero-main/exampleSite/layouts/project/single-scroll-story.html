{{ define "main" }}
<main class="story-main" data-scroll-story>
  <header class="story-hero">
    <p class="story-hero__label">{{ i18n "research_story" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="story-hero__subtitle">{{ . }}</p>{{ end }}
    {{ with .Params.description }}<p class="story-hero__description">{{ . }}</p>{{ end }}
    <p class="story-hero__prompt" aria-hidden="true">{{ i18n "scroll_prompt" }} <span>↓</span></p>
  </header>
  <div class="story-progress" aria-hidden="true"><span></span></div>
  <article class="story-content">
    {{ .Content }}
  </article>
</main>
<script src="{{ "js/scroll-story.js" | relURL }}" defer></script>
{{ end }}
